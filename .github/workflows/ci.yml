name: BLACKOUT Invoice CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: blackout-invoice-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package.json
      - name: Verify exact dependency pins
        run: node scripts/check-dependency-pins.mjs
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: High severity dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Typecheck and adversarial unit tests
        run: npm run check
      - name: Compact + Next production build
        run: npm run build:live
